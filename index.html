<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promedio De Notas</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="app" class="container mt-5" style="max-width: 500px;">
  <div class="card shadow">
    <div class="card-body">
      <h3 class="card-title text-center mb-4">Calculadora de Promedio</h3>

      <div class="mb-3">
        <label class="form-label">Bloque 1 (20%)</label>
        <input type="number" class="form-control" v-model.number="bloque1" min="0" max="10" step="0.1">
      </div>

      <div class="mb-3">
        <label class="form-label">Bloque 2 (20%)</label>
        <input type="number" class="form-control" v-model.number="bloque2" min="0" max="10" step="0.1">
      </div>

      <div class="mb-3">
        <label class="form-label">Bloque 3 (20%)</label>
        <input type="number" class="form-control" v-model.number="bloque3" min="0" max="10" step="0.1">
      </div>

      <div class="mb-3">
        <label class="form-label">Proyecto final (40%)</label>
        <input type="number" class="form-control" v-model.number="proyecto" min="0" max="10" step="0.1">
      </div>

      <button class="btn btn-primary w-100" @click="calcular">Calcular promedio</button>

      <div v-if="promedio !== null" class="alert mt-4 text-center" :class="promedio >= 6 ? 'alert-success' : 'alert-danger'">
        <h4>Promedio final: {{ promedio }}</h4>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        bloque1: null,
        bloque2: null,
        bloque3: null,
        proyecto: null,
        promedio: null
      };
    },
    methods: {
      calcular() {
        const notas = [this.bloque1, this.bloque2, this.bloque3, this.proyecto];

        // Validar que no haya campos vacíos ni notas fuera de rango
        if (notas.some(n => n === null || n === "" || n < 0 || n > 10)) {
          alert("Ingresa las cuatro notas con valores entre 0 y 10.");
          return;
        }

        const resultado =
          this.bloque1 * 0.20 +
          this.bloque2 * 0.20 +
          this.bloque3 * 0.20 +
          this.proyecto * 0.40;

        this.promedio = resultado.toFixed(2);
      }
    }
  }).mount("#app");
</script>
</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
